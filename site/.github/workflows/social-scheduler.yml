name: social-scheduler

# Posts the day's videos + Story to IG Reels / FB Reels / YouTube Shorts per
# social/schedule.json. Always-on (no Mac needed). Reuses the Python posters,
# which read creds from /tmp — we materialize those from repo secrets below.

on:
  schedule:                     # staggered across the day (UTC) — slot derived from the hour
    - cron: "0 12 * * *"        # ~early-AM ET   → slot "am"
    - cron: "0 17 * * *"        # ~lunch ET      → slot "mid"
    - cron: "0 22 * * *"        # ~evening ET    → slot "pm"
  workflow_dispatch:           # manual "Run workflow" button (posts ALL slots for the day)
    inputs:
      date:
        description: "Override date (YYYY-MM-DD), blank = today"
        required: false
      dry_run:
        description: "true = plan only, post nothing"
        required: false
        default: "false"
      slot:
        description: "am | mid | pm | all (manual runs default to all = whole day)"
        required: false
        default: "all"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize credentials from secrets
        run: |
          printf '%s' "${{ secrets.FB_PAGE_ID }}"   > /tmp/fb_page_id.txt
          printf '%s' "${{ secrets.FB_PAGE_TOKEN }}" > /tmp/fb_page_token.txt
          printf '%s' "${{ secrets.CR_IG_ID }}"      > /tmp/cr_ig_id.txt
          printf '%s' '${{ secrets.YT_TOKEN_JSON }}'    > /tmp/yt_token.json
          printf '%s' '${{ secrets.R2_JSON }}'          > /tmp/r2.json
          printf '%s' '${{ secrets.LI_PERSONAL_JSON }}' > /tmp/li_personal.json
          printf '%s' '${{ secrets.LI_COMPANY_JSON }}'  > /tmp/li_company.json
          printf '%s' '${{ secrets.BUFFER_TOKEN }}'     > /tmp/buffer_token.txt

      - name: Derive time-of-day slot from the run hour
        id: slot
        run: |
          SLOT="${{ github.event.inputs.slot }}"   # manual override (defaults to "all")
          if [ -z "$SLOT" ]; then                   # scheduled run → derive from the hour
            H=$(date -u +%H)
            if   [ "$H" -ge 11 ] && [ "$H" -le 13 ]; then SLOT=am
            elif [ "$H" -ge 16 ] && [ "$H" -le 18 ]; then SLOT=mid
            elif [ "$H" -ge 21 ];                     then SLOT=pm
            else SLOT=all; fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved slot: $SLOT"

      - name: Run scheduler
        env:
          BUFFER_TIKTOK_CHANNEL: ${{ secrets.BUFFER_TIKTOK_CHANNEL }}
        run: |
          ARGS="--slot ${{ steps.slot.outputs.slot }}"
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 scripts/run_scheduler.py $ARGS

      - name: Run card scheduler (Facebook native formats)
        env:
          CARDS_AUTOPOST: ${{ vars.CARDS_AUTOPOST }}   # set repo variable to "true" to post live; otherwise dry-run
        run: |
          ARGS="--slot ${{ steps.slot.outputs.slot }}"
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 scripts/run_cards.py $ARGS

      - name: Refresh engagement metrics (best-effort)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python3 scripts/fetch_metrics.py || true

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/fb_page_id.txt /tmp/fb_page_token.txt /tmp/cr_ig_id.txt /tmp/yt_token.json /tmp/r2.json /tmp/li_personal.json /tmp/li_company.json /tmp/buffer_token.txt
