<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <rect width="320" height="240" rx="16" fill="#F9F9F9"/>

  <!-- code editor mock -->
  <g transform="translate(40, 50)">
    <rect width="240" height="140" rx="12" fill="#0A1628"/>
    <!-- traffic lights -->
    <circle cx="18" cy="18" r="4" fill="#ef4444"/>
    <circle cx="32" cy="18" r="4" fill="#f59e0b"/>
    <circle cx="46" cy="18" r="4" fill="#00C080"/>
    <!-- divider -->
    <line x1="0" y1="32" x2="240" y2="32" stroke="rgba(255,255,255,0.06)"/>
    <!-- code lines -->
    <text x="18" y="58" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">&lt;script</text>
    <text x="58" y="58" font-family="JetBrains Mono, monospace" font-size="10" fill="#00E5A0">src=</text>
    <text x="86" y="58" font-family="JetBrains Mono, monospace" font-size="10" fill="white">"https://cr.io/c.js"</text>
    <text x="18" y="78" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">    async</text>
    <text x="18" y="98" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">&gt;&lt;/script&gt;</text>
    <!-- cursor -->
    <rect x="105" y="89" width="6" height="12" fill="#00E5A0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- success badge -->
    <g transform="translate(170, 110)">
      <rect width="58" height="20" rx="10" fill="#00E5A0"/>
      <text x="29" y="14" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="9" font-weight="700" fill="#0A1628">INSTALLED</text>
    </g>
  </g>
</svg>
