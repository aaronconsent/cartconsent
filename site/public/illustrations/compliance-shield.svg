  <!-- shield with checkmark -->
  <g transform="translate(265, 95)">
    <path d="M70 0 L130 22 L130 80 C130 122 105 156 70 170 C35 156 10 122 10 80 L10 22 Z" fill="#0A1628"/>
    <path d="M70 14 L120 32 L120 80 C120 118 98 148 70 160 C42 148 20 118 20 80 L20 32 Z" fill="#00E5A0"/>
    <path d="M48 86 L64 102 L94 70" stroke="#0A1628" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- compliance chips -->
  <g transform="translate(260, 275)" font-family="Hanken Grotesk, sans-serif" font-size="11" font-weight="700">
    <g transform="translate(0,0)"><rect width="50" height="22" rx="11" fill="white" stroke="#0A1628"/><text x="25" y="15" text-anchor="middle" fill="#0A1628">GDPR</text></g>
    <g transform="translate(58,0)"><rect width="50" height="22" rx="11" fill="white" stroke="#0A1628"/><text x="25" y="15" text-anchor="middle" fill="#0A1628">CCPA</text></g>
    <g transform="translate(116,0)"><rect width="40" height="22" rx="11" fill="white" stroke="#0A1628"/><text x="20" y="15" text-anchor="middle" fill="#0A1628">CPA</text></g>
