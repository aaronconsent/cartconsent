    <line x1="14" y1="22" x2="106" y2="22" stroke="#e6e6e6"/>
    <line x1="14" y1="36" x2="80" y2="36" stroke="#e6e6e6"/>
    <line x1="14" y1="50" x2="92" y2="50" stroke="#e6e6e6"/>
    <line x1="14" y1="64" x2="70" y2="64" stroke="#e6e6e6"/>
    <line x1="14" y1="78" x2="88" y2="78" stroke="#e6e6e6"/>
    <line x1="14" y1="92" x2="58" y2="92" stroke="#e6e6e6"/>
    <line x1="14" y1="106" x2="100" y2="106" stroke="#e6e6e6"/>
    <line x1="14" y1="120" x2="74" y2="120" stroke="#e6e6e6"/>
    <line x1="14" y1="134" x2="86" y2="134" stroke="#e6e6e6"/>
