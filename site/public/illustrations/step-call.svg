<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <rect width="320" height="240" rx="16" fill="#F9F9F9"/>

  <!-- pulse rings behind phone -->
  <g transform="translate(160, 120)">
    <circle r="44" fill="none" stroke="#00C080" stroke-width="1.2" opacity="0.18"/>
    <circle r="62" fill="none" stroke="#00C080" stroke-width="1.2" opacity="0.13"/>
    <circle r="80" fill="none" stroke="#00C080" stroke-width="1.2" opacity="0.08"/>
  </g>

  <!-- phone -->
  <g transform="translate(120, 60)">
    <rect width="80" height="120" rx="14" fill="#0A1628"/>
    <rect x="3" y="3" width="74" height="114" rx="11" fill="#F9F9F9"/>
    <!-- notch -->
    <rect x="32" y="6" width="16" height="3" rx="1.5" fill="#0A1628"/>

    <!-- incoming call card -->
    <g transform="translate(8, 18)">
      <rect width="64" height="80" rx="8" fill="white" stroke="#e6e6e6"/>
      <text x="32" y="14" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="6" font-weight="700" fill="#00A86E" letter-spacing="1">INCOMING LEAD</text>
      <circle cx="32" cy="30" r="8" fill="#0A1628"/>
      <text x="32" y="33" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="6" font-weight="700" fill="#00E5A0">SJ</text>
      <text x="32" y="48" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="7" font-weight="700" fill="#0A1628">Sarah J.</text>
      <text x="32" y="58" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="5" fill="#4A5568">(512) 555-0142</text>
      <!-- accept button -->
      <g transform="translate(20, 64)">
        <rect width="24" height="10" rx="5" fill="#00C080"/>
        <text x="12" y="7.5" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="5" font-weight="700" fill="white">CALL</text>
      </g>
    </g>
  </g>
</svg>
