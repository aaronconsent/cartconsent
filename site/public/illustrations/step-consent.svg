<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <rect width="320" height="240" rx="16" fill="#F9F9F9"/>

  <!-- consent banner -->
  <g transform="translate(40, 70)">
    <rect width="240" height="100" rx="12" fill="white" stroke="#e6e6e6"/>
    <!-- shield icon -->
    <g transform="translate(18, 18)">
      <rect width="28" height="28" rx="8" fill="#0A1628"/>
      <path d="M14 8 L20 11 L20 16 C20 19 17.5 21.5 14 22 C10.5 21.5 8 19 8 16 L8 11 Z" fill="#00E5A0"/>
    </g>
    <!-- title -->
    <text x="58" y="28" font-family="Hanken Grotesk, sans-serif" font-size="11" font-weight="700" fill="#0A1628">Get personalized service updates?</text>
    <text x="58" y="44" font-family="Hanken Grotesk, sans-serif" font-size="9" fill="#4A5568">Tap Yes to let us match you with a local pro.</text>
    <!-- buttons -->
    <g transform="translate(120, 60)">
      <rect width="50" height="22" rx="6" fill="white" stroke="#e6e6e6"/>
      <text x="25" y="15" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="9" font-weight="600" fill="#4A5568">No thanks</text>
    </g>
    <g transform="translate(176, 60)">
      <rect width="46" height="22" rx="6" fill="#00C080"/>
      <text x="23" y="15" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="9" font-weight="700" fill="white">Yes</text>
    </g>
    <!-- finger tap -->
    <g transform="translate(212, 78)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00C080" stroke-width="1.5" opacity="0.6">
        <animate attributeName="r" values="6;18;6" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="5" fill="#0A1628"/>
    </g>
  </g>
</svg>
