    <circle cx="380" cy="80" r="6"/>
    <circle cx="80" cy="130" r="6"/>
    <circle cx="130" cy="130" r="6"/>
    <circle cx="180" cy="130" r="6"/>
    <circle cx="280" cy="130" r="6"/>
    <circle cx="330" cy="130" r="6"/>
    <circle cx="380" cy="130" r="6"/>
    <circle cx="80" cy="230" r="6"/>
    <circle cx="180" cy="230" r="6"/>
    <circle cx="230" cy="230" r="6"/>
