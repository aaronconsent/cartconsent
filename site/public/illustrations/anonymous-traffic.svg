    <line x1="266" y1="170" x2="290" y2="168" stroke="#0A1628" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>

  <!-- pulse highlight on 2 other dots -->
  <circle cx="230" cy="130" r="6" fill="#00C080" opacity="0.5"/>
  <circle cx="130" cy="230" r="6" fill="#00C080" opacity="0.5"/>
  <circle cx="330" cy="230" r="6" fill="#00C080" opacity="0.5"/>
