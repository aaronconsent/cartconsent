    <text x="230" y="187" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="16" font-weight="700" fill="#00E5A0">SJ</text>

    <!-- Identifying tag -->
    <g transform="translate(290, 145)">
      <rect width="120" height="74" rx="10" fill="white" stroke="#e6e6e6"/>
      <text x="14" y="22" font-family="Hanken Grotesk, sans-serif" font-size="11" font-weight="700" fill="#0A1628">Sarah J.</text>
      <text x="14" y="38" font-family="JetBrains Mono, monospace" font-size="9" fill="#4A5568">(512) 555-0142</text>
      <line x1="14" y1="46" x2="106" y2="46" stroke="#e6e6e6"/>
      <text x="14" y="62" font-family="Hanken Grotesk, sans-serif" font-size="9" font-weight="700" fill="#00A86E" letter-spacing="1">CONSENTED</text>
